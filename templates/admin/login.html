<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ZarGo Admin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
    :root{--gold:#f4a700;--glass:rgba(255,255,255,.07);--gb:rgba(255,255,255,.12)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
      min-height:100vh;display:flex;align-items:center;justify-content:center;color:#f0f0f0;
    }
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;
      background:radial-gradient(ellipse 70% 60% at 30% 20%,rgba(244,167,0,.12),transparent 60%);
    }
    .box{
      position:relative;z-index:1;
      background:var(--glass);border:1px solid var(--gb);border-radius:24px;
      backdrop-filter:blur(20px);padding:40px 32px;width:90%;max-width:380px;
      animation:popIn .5s cubic-bezier(.17,.67,.32,1.3);
    }
    @keyframes popIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
    .logo{text-align:center;margin-bottom:28px}
    .logo-icon{
      width:64px;height:64px;border-radius:18px;
      background:linear-gradient(135deg,var(--gold),#ffd700);
      display:flex;align-items:center;justify-content:center;
      font-size:32px;margin:0 auto 10px;
      box-shadow:0 0 30px rgba(244,167,0,.5);
    }
    .logo-title{font-size:26px;font-weight:800;
      background:linear-gradient(90deg,var(--gold),#ffd700,#fff);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .logo-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}
    .flash{padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px;
      background:rgba(255,77,109,.15);border:1px solid rgba(255,77,109,.3);color:#ff8fa3}
    label{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:6px;display:block}
    input{
      width:100%;background:rgba(255,255,255,.07);border:1px solid var(--gb);
      border-radius:12px;color:#f0f0f0;font-size:15px;font-family:'Poppins',sans-serif;
      padding:12px 14px;outline:none;transition:border-color .25s;margin-bottom:20px;
    }
    input:focus{border-color:var(--gold)}
    input::placeholder{color:rgba(255,255,255,.35)}
    button{
      width:100%;background:linear-gradient(135deg,var(--gold),#d08800);
      color:#000;border:none;cursor:pointer;padding:13px;border-radius:12px;
      font-size:15px;font-weight:700;font-family:'Poppins',sans-serif;
      transition:all .3s;box-shadow:0 4px 18px rgba(244,167,0,.4);
    }
    button:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(244,167,0,.6)}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">
      <div class="logo-icon">⚙️</div>
      <div class="logo-title">ZarGo Admin</div>
      <div class="logo-sub">Boshqaruv paneli</div>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for _, msg in messages %}<div class="flash">❌ {{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="POST">
      <label>Parol</label>
      <input type="password" name="password" placeholder="••••••••" autofocus required/>
      <button type="submit">Kirish →</button>
    </form>
  </div>
</body>
</html>
